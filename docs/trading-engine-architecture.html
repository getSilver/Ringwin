<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ringwin · Deterministic Trading Engine</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080b12;
      --panel: #101622;
      --line: #293348;
      --text: #eef4ff;
      --muted: #8491a8;
      --data: #20d5d2;
      --strategy: #a98bff;
      --risk: #ffbd5c;
      --order: #59e391;
      --fact: #ff769a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--text);
      background:
        radial-gradient(circle at 50% -20%, #17243c 0, transparent 38%),
        radial-gradient(circle at 95% 40%, #122727 0, transparent 24%),
        var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(1500px, 100%);
      margin: 0 auto;
      padding: 42px 24px 30px;
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 24px;
    }

    .eyebrow {
      margin: 0 0 9px;
      color: var(--data);
      font: 700 11px/1.2 ui-monospace, SFMono-Regular, Consolas, monospace;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      max-width: 840px;
      font-size: clamp(28px, 4vw, 52px);
      font-weight: 590;
      letter-spacing: -.045em;
    }

    .subtitle {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 15px;
    }

    button {
      min-width: 110px;
      padding: 10px 14px;
      color: #dce7fa;
      border: 1px solid #33405a;
      border-radius: 10px;
      background: #111827;
      font: 650 12px/1 ui-monospace, SFMono-Regular, Consolas, monospace;
      cursor: pointer;
    }

    button:hover { border-color: var(--data); }
    button:focus-visible { outline: 2px solid var(--data); outline-offset: 3px; }

    .canvas {
      position: relative;
      overflow: hidden;
      border: 1px solid #202a3c;
      border-radius: 22px;
      background:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(145deg, rgba(15,22,35,.97), rgba(7,10,17,.98));
      background-size: 42px 42px, 42px 42px, auto;
      box-shadow: 0 34px 100px rgba(0,0,0,.42), inset 0 1px rgba(255,255,255,.03);
    }

    .canvas::before {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      content: "";
      background: radial-gradient(circle at 50% 45%, rgba(32,213,210,.055), transparent 35%);
    }

    svg {
      position: relative;
      z-index: 1;
      display: block;
      width: 100%;
      height: auto;
      min-height: 620px;
    }

    .zone {
      fill: rgba(255,255,255,.012);
      stroke: #263147;
      stroke-width: 1;
      stroke-dasharray: 4 7;
    }

    .zone-title {
      fill: #65728a;
      font: 700 12px ui-monospace, SFMono-Regular, Consolas, monospace;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .node .surface {
      fill: url(#node-surface);
      stroke: #344159;
      stroke-width: 1.2;
      transition: stroke .18s ease, filter .18s ease, transform .18s ease;
    }

    .node.core .surface {
      fill: url(#core-surface);
      stroke: #35706f;
    }

    .node:hover .surface {
      stroke: var(--data);
      filter: url(#soft-glow);
      transform: translateY(-2px);
    }

    .node text { pointer-events: none; }

    .node-title {
      fill: #f1f5ff;
      font: 650 15px ui-sans-serif, system-ui, sans-serif;
    }

    .node-sub {
      fill: #8290a8;
      font: 500 11px ui-monospace, SFMono-Regular, Consolas, monospace;
    }

    .chip { fill: rgba(255,255,255,.045); stroke: rgba(255,255,255,.08); }
    .chip-text {
      fill: #9eabc0;
      font: 600 9px ui-monospace, SFMono-Regular, Consolas, monospace;
      letter-spacing: .04em;
    }

    .shard-id {
      fill: var(--data);
      font: 750 11px ui-monospace, SFMono-Regular, Consolas, monospace;
      letter-spacing: .08em;
    }

    .flow-line {
      fill: none;
      stroke: var(--flow-color);
      stroke-width: 1.35;
      stroke-opacity: .29;
      marker-end: url(#arrow);
    }

    .flow-line[data-kind="data"] { --flow-color: var(--data); }
    .flow-line[data-kind="strategy"] { --flow-color: var(--strategy); }
    .flow-line[data-kind="risk"] { --flow-color: var(--risk); }
    .flow-line[data-kind="order"] { --flow-color: var(--order); }
    .flow-line[data-kind="fact"] { --flow-color: var(--fact); }
    .flow-line[data-bus] { marker-end: none; }

    .packet {
      filter: url(#packet-glow);
      pointer-events: none;
    }

    .packet.data { fill: var(--data); }
    .packet.strategy { fill: var(--strategy); }
    .packet.risk { fill: var(--risk); }
    .packet.order { fill: var(--order); }
    .packet.fact { fill: var(--fact); }

    .status-dot {
      fill: var(--order);
      filter: url(#packet-glow);
      animation: breathe 1.8s ease-in-out infinite;
    }

    @keyframes breathe {
      50% { opacity: .35; }
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      padding: 18px 16px 20px;
      color: var(--muted);
      border-top: 1px solid #1e2738;
      font: 600 11px ui-monospace, SFMono-Regular, Consolas, monospace;
    }

    .legend span { display: inline-flex; align-items: center; gap: 8px; }
    .legend i { width: 7px; height: 7px; border-radius: 50%; box-shadow: 0 0 9px currentColor; }

    footer {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      padding: 16px 4px 0;
      color: #66738a;
      font-size: 11px;
    }

    @media (max-width: 760px) {
      main { padding: 28px 12px 20px; }
      header { align-items: flex-start; flex-direction: column; }
      svg { min-width: 980px; min-height: 0; }
      .canvas { overflow-x: auto; }
      .legend { justify-content: flex-start; }
      footer { flex-direction: column; gap: 5px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .status-dot { animation: none; }
    }
  </style>
</head>

  <script>
    const svg = document.querySelector("#architecture");
    const lines = [...svg.querySelectorAll(".flow-line")];
    const ns = "http://www.w3.org/2000/svg";
    const packets = [];

    for (const [lineIndex, line] of lines.entries()) {
      for (let packetIndex = 0; packetIndex < 2; packetIndex++) {
        const packet = document.createElementNS(ns, "circle");
        packet.setAttribute("class", `packet ${line.dataset.kind}`);
        packet.setAttribute("r", "3.4");
        packet.setAttribute("aria-hidden", "true");
        line.parentNode.append(packet);
        packets.push({
          element: packet,
          path: line,
          length: line.getTotalLength(),
          duration: Number(line.dataset.dur) + packetIndex * .35,
          phase: (lineIndex % 5) * .63 + packetIndex * 1.4,
        });
      }
    }

    function placePacket(packet, elapsedSeconds) {
      const progress = ((elapsedSeconds + packet.phase) % packet.duration) / packet.duration;
      const point = packet.path.getPointAtLength(progress * packet.length);
      packet.element.setAttribute("cx", point.x);
      packet.element.setAttribute("cy", point.y);
    }

    packets.forEach((packet) => placePacket(packet, 0));

    console.assert(
      lines.length >= 15 &&
      packets.length === lines.length * 2 &&
      packets.every((packet) => packet.length > 0 && packet.element.hasAttribute("cx")),
      "Architecture flow animation did not initialize",
    );

    const toggle = document.querySelector("#motion-toggle");
    let paused = matchMedia("(prefers-reduced-motion: reduce)").matches;
    let pausedAt = paused ? performance.now() : 0;
    let origin = performance.now();

    function render(now) {
      if (paused) return;
      const elapsedSeconds = (now - origin) / 1000;
      packets.forEach((packet) => placePacket(packet, elapsedSeconds));
      requestAnimationFrame(render);
    }

    if (paused) {
      toggle.setAttribute("aria-pressed", "true");
      toggle.textContent = "启用流转";
    } else {
      requestAnimationFrame(render);
    }

    toggle.addEventListener("click", () => {
      const now = performance.now();
      if (paused) {
        origin += now - pausedAt;
        requestAnimationFrame(render);
      } else {
        pausedAt = now;
      }
      paused = !paused;
      toggle.setAttribute("aria-pressed", String(paused));
      toggle.textContent = paused ? "继续流转" : "暂停流转";
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Ringwin 控制面</title>
<style>
  :root { --bg:#0f1419; --panel:#1a212b; --line:#2a3442; --fg:#d8dee6; --dim:#7d8894;
          --ok:#3fb96f; --warn:#e0a63a; --bad:#e05555; --accent:#4a9eda; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.5 "Cascadia Code",Consolas,"Microsoft YaHei",monospace; }
  h2 { font-size:15px; margin:0 0 10px; color:var(--dim); letter-spacing:1px; }
  h3 { font-size:13px; margin:14px 0 8px; color:var(--dim); }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:14px; margin-bottom:12px; }
  .pill { display:inline-block; padding:2px 10px; border-radius:99px; font-size:12px; font-weight:bold; }
  .ok   { background:#153826; color:var(--ok); }
  .warn { background:#3a2f14; color:var(--warn); }
  .bad  { background:#3a1515; color:var(--bad); }
  .dim  { color:var(--dim); } .pos { color:var(--ok); } .neg { color:var(--bad); }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  td,th { text-align:left; padding:4px 8px; border-bottom:1px solid var(--line); }
  th { color:var(--dim); font-weight:normal; }
  button { background:#223042; color:var(--fg); border:1px solid #35485e;
           border-radius:6px; padding:7px 12px; cursor:pointer; font:inherit; }
  button:hover { background:#2c3f56; }
  button.danger { background:#3a1515; border-color:#6e2828; color:#ff9c9c; }
  button.primary { background:#173a57; border-color:#2b5f8a; color:#9cd0ff; }
  input { background:#0d1117; color:var(--fg); border:1px solid var(--line);
          border-radius:6px; padding:8px; font:inherit; }
</style>
</head>
<body>
<div id="login" style="display:none;max-width:380px;margin:12vh auto" class="panel">
  <h2>RINGWIN 控制面 — SystemOwner 登录</h2>
  <p><input id="l-pass" type="password" placeholder="口令" style="width:100%"></p>
  <p><input id="l-totp" placeholder="TOTP 验证码" style="width:100%"></p>
  <button class="primary" style="width:100%" onclick="doLogin()">登录</button>
  <p id="l-err" class="neg"></p>
</div>

<div id="shell" style="display:none"><div style="display:flex;min-height:100vh">
  <div style="width:210px;background:var(--panel);border-right:1px solid var(--line);padding:16px;position:sticky;top:0;height:100vh">
    <h2 style="color:var(--accent)">RINGWIN 控制面</h2>
    <div id="nav"></div>
    <p class="dim" style="font-size:11px;margin-top:24px">SystemOwner ✓<br>投影刷新: 1s 轮询<br><a href="#" onclick="doLogout()" class="dim">登出</a></p>
  </div>
  <div style="flex:1;padding:20px" id="main"></div>
</div></div>

<div id="overlay" style="position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:40"></div>

<script>
let CSRF = "";
let SHARDS = [];
const HIGH_RISK = ["enable_trading","de_risk","stop_keep_positions","resolve_latch","kill_switch"];
const LIFECYCLE_HIGH_RISK = ["deploy_release","forward_rollback","credential_activate",
  "credential_revoke","failover"];
const PAGES = ["总览","持仓挂单","风险与保证金","盈亏","操作台","命令历史"];
let currentPage = 0;

async function api(method, path, body) {
  const headers = {"Content-Type":"application/json"};
  if (CSRF) headers["X-Owner-CSRF"] = CSRF;
  const r = await fetch(path, {method, headers,
    body: body === undefined ? undefined : JSON.stringify(body ?? {})});
  return [r.status, await r.json()];
}

// ---------- 认证 ----------
async function tryBoot() {
  const [status] = await api("GET", "/api/projection");
  if (status === 200) { document.getElementById("login").style.display="none";
                        document.getElementById("shell").style.display="block";
                        poll(); return true; }
  document.getElementById("login").style.display="block"; return false;
}
async function doLogin() {
  const [status, body] = await api("POST", "/login",
    {passphrase: document.getElementById("l-pass").value,
     code: document.getElementById("l-totp").value});
  if (status !== 200) {
    document.getElementById("l-err").textContent = body.error + (status===429 ? "（限速中）" : "");
    return;
  }
  CSRF = body.csrf_token;
  document.getElementById("l-pass").value = ""; document.getElementById("l-totp").value = "";
  await tryBoot();
}
async function doLogout(){ await api("POST","/logout",{}); location.reload(); }

// ---------- 数据轮询 ----------
let lastFeedSeq = 0;
async function poll() {
  try {
    const [status, body] = await api("GET", "/api/projection");
    if (status === 200) { SHARDS = body.shards; render(); }
    else if (status === 401) location.reload();
  } catch (e) { /* keep last view */ }
  setTimeout(poll, 1000);
}

// ---------- 渲染 ----------
function modePill(s) {
  if (!s.effective_authority && s.unresolved_latches > 0)
    return `<span class="pill bad">KILL/锁存 ${s.unresolved_latches}</span>`;
  if (s.mode === "draining") return '<span class="pill warn">DRAINING</span>';
  return s.effective_authority ? '<span class="pill ok">TRADING ✓授权</span>'
                               : `<span class="pill warn">${(s.mode||"?").toUpperCase()}·无授权</span>`;
}
function fmtMicros(v){ return v==null?"—":(v/1e6).toLocaleString(undefined,{maximumFractionDigits:2}); }
function shardCard(s) {
  const liq_bps = s.mark_price_micros && s.position_margin_requirement_micros
    ? Math.round(s.position_margin_requirement_micros/50) : null; // 展示推导占位
  return `<div class="panel"><b>shard-${s.target_identity}</b> ${modePill(s)}
    &nbsp;<span class="dim">seq ${s.last_sequence} · ${s.status}</span>
    <div style="margin-top:8px;display:flex;gap:18px;flex-wrap:wrap">
      <span>挂单 <b>${s.open_orders}</b></span>
      <span>仓位 <b>${s.portfolio_position_quantity}</b></span>
      <span>保证金占用 <b>${fmtMicros(s.position_margin_requirement_micros)}</b></span>
      <span>挂单预留 <b>${fmtMicros(s.open_order_reservation_micros)}</b></span>
      <span>OpenCost <b>${fmtMicros(s.open_cost_micros)}</b></span>
      ${s.reconciliation_break?'<span class="pill bad">对账 BREAK</span>':''}
      ${s.may_reduce_only?'<span class="pill warn">仅减仓</span>':''}
    </div>
    <p class="dim" style="font-size:12px;margin:6px 0 0">详情见 风险与保证金 / 盈亏 / 持仓挂单 分页</p></div>`;
}
function gateRows(s){
  return s.gates.map(g=>`<tr><td>${g.reason}</td><td>${g.kind}</td>`+
    `<td>${g.open?'<span class="pill ok">开</span>':'<span class="pill bad">闭</span>'}</td></tr>`).join("");
}
function pageOverview(){
  return `<h2>总览</h2>
    <div class="grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:16px 12px">
      ${SHARDS.map(shardCard).join("")}</div>
    <div class="panel"><h2>SafetyGates</h2>
    ${SHARDS.map(s=>`<h3>shard-${s.target_identity}</h3><table>
      <tr><th>原因</th><th>类型</th><th>状态</th></tr>${gateRows(s)}</table>`).join("")}</div>`;
}
function pageOrders(){
  return `<h2>持仓挂单</h2><div class="panel"><table>
    <tr><th>分片</th><th>仓位数量</th><th>交易所数量</th><th>OpenCost</th><th>状态</th></tr>
    ${SHARDS.map(s=>`<tr><td>shard-${s.target_identity}</td><td>${s.portfolio_position_quantity}</td>
      <td>${s.exchange_position_quantity}</td><td>${fmtMicros(s.open_cost_micros)}</td>
      <td>${s.open_orders>0?`未决 ${s.open_orders}`:"—"}</td></tr>`).join("")}
  </table>
  <p class="dim" style="font-size:12px;margin-bottom:0">逐笔挂单明细由 OMS 事实流提供, 本页为分片汇总。</p></div>`;
}
function pageMargin(){
  return `<h2>风险与保证金</h2>` + SHARDS.map(s=>{
    const tier = k => s.reconciliation_break && k==="kill"
      ? '<span class="pill bad">差异锁存</span>' : '<span class="pill ok">正常</span>';
    return `<div class="panel"><b>shard-${s.target_identity}</b> ${modePill(s)}
      <table style="margin-top:8px">
        <tr><th>标记价格 (micros)</th><td>${s.mark_price_micros}</td>
            <th>持仓保证金要求</th><td>${fmtMicros(s.position_margin_requirement_micros)}</td></tr>
        <tr><th>挂单风险预留</th><td>${fmtMicros(s.open_order_reservation_micros)}</td>
            <th>Unknown/挂单释放</th><td>仅权威事实释放</td></tr>
        <tr><th>对账差异</th><td colspan="3">${s.reconciliation_break?'<span class="pill bad">BREAK — 已锁存新增风险</span>':'<span class="pill ok">无</span>'}</td></tr>
      </table>
      <h3>MarginSafetyGates (OpeningGate / WarningGate / KillGate)</h3>
      <table><tr><th>核心定点计算</th><th>状态</th></tr>
        <tr><td>OrderCommand 前闭合 (Strategy→Portfolio→Domain→Account→Global)</td>
        <td>${tier("kill")}</td></tr></table></div>`;
  }).join("");
}
function pagePnl(){
  return `<h2>盈亏</h2>` + SHARDS.map(s=>`
    <div class="panel"><b>shard-${s.target_identity}</b> ${modePill(s)}
      <table style="margin-top:8px">
        <tr><th>持仓 OpenCost</th><td>${fmtMicros(s.open_cost_micros)}</td>
            <th>标记价格 (micros)</th><td>${s.mark_price_micros}</td></tr>
        <tr><th>持仓数量</th><td>${s.portfolio_position_quantity}</td>
            <th>组合现金 (micros)</th><td>—</td></tr>
      </table>
      <p class="dim" style="font-size:12px;margin-bottom:0">未实现盈亏属于 ValuationSnapshot,
      不进入权威账本; 权威输入以上述字段为准。</p></div>`).join("");
}
function pageOps(){
  return `<h2>操作台</h2>` +
    SHARDS.map(s=>`<div class="panel"><b>shard-${s.target_identity}</b> ${modePill(s)}
      <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
        <button class="${HIGH_RISK.includes('enable_trading')?'primary':''}" onclick="submitKind('enable_trading',${s.target_identity})">EnableTrading*</button>
        <button onclick="submitKind('trading_pause',${s.target_identity})">Pause</button>
        <button onclick="submitKind('cancel_open_orders',${s.target_identity})">CancelOpenOrders</button>
        <button class="primary" onclick="submitKind('de_risk',${s.target_identity})">DeRisk→0*</button>
        <button class="danger" onclick="openLatchFlow(${s.target_identity})">ResolveLatch*</button>
        <button class="danger" onclick="submitKind('kill_switch',${s.target_identity})">KillSwitch*</button>
        <button class="primary" onclick="submitLifecycle('deploy_release',${s.target_identity})">DeployRelease*</button>
        <button onclick="submitLifecycle('forward_rollback',${s.target_identity})">ForwardRollback*</button>
        <button onclick="submitLifecycle('credential_rotate',${s.target_identity})">CredentialRotate</button>
        <button class="danger" onclick="submitLifecycle('failover',${s.target_identity})">Failover*</button>
      </div></div>`).join("") +
    `<p class="dim">* = 需要 RiskWarning 确认</p>
     <div class="panel"><h2>事实流 (最新在前)</h2><div id="feed">— 等待事件 —</div></div>`;
}
function pageRecords(){
  return `<h2>命令历史</h2><div class="panel"><div id="records">加载中…</div></div>`;
}
const RENDERERS = [pageOverview,pageOrders,pageMargin,pagePnl,pageOps,pageRecords];
function drawNav(){
  document.getElementById("nav").innerHTML = PAGES.map((n,i)=>
    `<div onclick="go(${i})" style="padding:9px 10px;border-radius:6px;cursor:pointer;margin-bottom:4px;
      background:${i===currentPage?'#223042':'transparent'}">${n}</div>`).join("");
}
function go(i){ currentPage=i; render(); }
let feedLines = [];
function render(){
  drawNav();
  document.getElementById("main").innerHTML = RENDERERS[currentPage]();
  if (currentPage === 4) renderFeed();
  if (currentPage === 5) loadRecords();
}
async function loadRecords(){
  const [status, body] = await api("GET","/operator-records");
  const el = document.getElementById("records"); if(!el) return;
  el.innerHTML = "<table><tr><th>时间</th><th>命令</th><th>目标</th><th>警示</th></tr>" +
    body.records.map(r=>`<tr><td>${new Date(r.recorded_at*1000).toTimeString().slice(0,8)}</td>
      <td>${r.kind}</td><td>@${r.target_identity}</td><td>${r.risk_warning_identity??"—"}</td></tr>`).join("") + "</table>";
}
function renderFeed(){
  const el = document.getElementById("feed");
  if (el) el.innerHTML = feedLines.length
    ? feedLines.map(l=>`<div>· ${l}</div>`).join("") : "— 暂无新事实 —";
}

// ---------- 命令流 ----------
async function submitKind(kind, target){
  const command = {kind, target_identity:String(target),
                   command_identity:newIdentity(),
                   expected_version: expectedVersion(target)};
  if (HIGH_RISK.includes(kind)) {
    const [ws, warning] = await api("POST","/risk-warning",command);
    if (ws !== 200) return toast(`⚠ ${warning.error}`, "bad");
    if (!confirmRiskDialog(warning)) return;
    command.risk_warning_acknowledged = true;
    command.risk_warning_identity = warning.warning_identity;
    if (warning.referenced_latch_identity)
      command.referenced_latch_identity = warning.referenced_latch_identity;
  }
  const [status, body] = await api("POST","/command",command);
  toast(status===200 ? `${kind} @ shard-${target} 已入队`
                     : `✗ ${body.error}`, status===200?"ok":"bad");
  feedLines.unshift(`${new Date().toTimeString().slice(0,8)} ${kind} @ shard-${target}` +
                    (status===200 ? " 已签名入队" : " 被拒绝"));
  render();
}
function newIdentity(){
  const hex = crypto.randomUUID().replaceAll("-", "");
  return BigInt("0x"+hex).toString();
}
async function submitLifecycle(kind, target){
  const command = {kind, target_identity:String(target), target:String(target),
                   command_identity:newIdentity()};
  if (kind === "deploy_release" || kind === "forward_rollback") {
    command.manifest_path = prompt("请输入已批准 ReleaseArtifact manifest 路径:");
    if (!command.manifest_path) return;
    command.expected_active = prompt("当前 active artifact（留空表示首次发布）:") || null;
  } else if (kind === "credential_rotate") {
    const version = prompt("请输入凭证版本号:");
    if (!version) return;
    command.details = {version:Number(version)};
  }
  if (LIFECYCLE_HIGH_RISK.includes(kind)) {
    const [ws, warning] = await api("POST","/risk-warning",command);
    if (ws !== 200) return toast(`⚠ ${warning.error}`, "bad");
    if (!confirmRiskDialog(warning)) return;
    command.risk_warning_acknowledged = true;
    command.risk_warning_identity = warning.warning_identity;
  }
  const [status, body] = await api("POST","/lifecycle",command);
  toast(status===200 ? `${kind} 已提交` : `✗ ${body.error}`,
        status===200?"ok":"bad");
  feedLines.unshift(`${new Date().toTimeString().slice(0,8)} ${kind}` +
                    (status===200 ? " 已签名提交" : " 被拒绝"));
  render();
}
function expectedVersion(target){
  const s = SHARDS.find(x=>String(x.target_identity)===String(target));
  return s ? s.operational_version : 0;
}
function confirmRiskDialog(warning){
  return window.confirm(
    `⚠ 高风险操作 RiskWarning (${warning.warning_identity})\n\n`+
    `对象: shard-${warning.target_identity}\n操作: ${warning.kind}\n\n`+
    `后果: ${warning.consequence}\n\n确认执行?`);
}
async function openLatchFlow(target){
  // 解除锁存需要 latch identity; 从 gates 里找 operator_kill 锁存的分片提示手工输入。
  const latch = prompt("请输入要解除的 latch identity:");
  if (!latch) return;
  const command = {kind:"resolve_latch", target_identity:String(target),
                   command_identity:newIdentity(),
                   referenced_latch_identity:latch};
  const [ws, warning] = await api("POST","/risk-warning",command);
  if (ws !== 200) return toast(`⚠ ${warning.error}`, "bad");
  command.risk_warning_acknowledged = true;
  command.risk_warning_identity = warning.warning_identity;
  const [status, body] = await api("POST","/command",command);
  toast(status===200?"resolve_latch 已入队":`✗ ${body.error}`, status===200?"ok":"bad");
}
function toast(msg, cls){
  const el = document.createElement("div");
  el.style.cssText = `position:fixed;top:16px;right:16px;padding:10px 16px;border-radius:8px;
    z-index:60;border:1px solid var(--${cls});background:${cls==="ok"?"#153826":"#3a1515"};
    color:var(--${cls})`;
  el.textContent = msg; document.body.appendChild(el);
  setTimeout(()=>el.remove(), 3500);
}
tryBoot();
</script>
</body>
</html>
